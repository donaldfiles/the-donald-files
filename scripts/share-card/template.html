<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#0E0E0E;--manila:#E8DCC8;--ink:#1A1510;--stamp:#D1001F;--hot:#FFD400;--paper:#F4EFE6}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--bg)}
.card{position:relative;display:flex;flex-direction:column;padding-bottom:118px!important;width:1200px;height:630px;padding:56px 64px 0;background:
 radial-gradient(1200px 500px at 85% -10%,#2a0006 0%,transparent 60%),var(--bg);font-family:'IBM Plex Sans',sans-serif}
.grain{position:absolute;inset:0;opacity:.07;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.top{display:flex;align-items:center;gap:18px}
.kicker{background:var(--hot);color:#000;font:700 26px/1 'Antonio',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px 8px;transform:rotate(-1.5deg)}
.file{font:600 18px/1 'IBM Plex Mono',monospace;color:#8a8278;letter-spacing:.12em}
.hed{margin-top:auto;max-width:1040px;color:var(--paper);font:700 96px/1.06 'Antonio',sans-serif;text-transform:uppercase;letter-spacing:-.005em}
.hed em{font-style:normal;color:#fff;background:linear-gradient(transparent 14%,var(--stamp) 14%,var(--stamp) 94%,transparent 94%);padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hed.short{font-size:150px}.hed.long{font-size:82px}.hed.xlong{font-size:68px}
.dek{margin-top:22px;max-width:900px;color:#cfc6b8;font:400 26px/1.3 'IBM Plex Serif',serif;font-style:italic}
.foot{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--manila);display:flex;align-items:center;justify-content:space-between;padding:0 64px;border-top:6px solid var(--stamp)}
.brand{font:700 40px/1 'Antonio',sans-serif;color:var(--ink);letter-spacing:.02em}
.brand b{color:var(--stamp)}
.url{font:600 20px/1 'IBM Plex Mono',monospace;color:var(--ink);letter-spacing:.1em}
.stamp{position:absolute;right:64px;top:50px;border:5px solid var(--stamp);color:var(--stamp);font:700 30px/1 'IBM Plex Mono',monospace;letter-spacing:.18em;padding:10px 16px;transform:rotate(6deg);opacity:.92}
</style></head><body>
<div class="card"><div class="grain"></div>
 <div class="top"><span class="kicker" id="k">{{KICKER}}</span><span class="file" id="f">{{FILE}}</span></div>
 <div class="stamp" id="s">{{STAMP}}</div>
 <h1 class="hed" id="h">{{HED}}</h1>
 <p class="dek" id="d">{{DEK}}</p>
 <div class="foot"><span class="brand">THE <b>DONALD</b> FILES</span><span class="url">THEDONALDFILES.COM</span></div>
</div>
<script>
const q=new URLSearchParams(location.search),set=(id,v)=>{const e=document.getElementById(id);if(v)e.innerHTML=v;else e.remove()};
set('k',q.get('kicker'));set('f',q.get('file'));set('s',q.get('stamp'));set('d',q.get('dek'));
const h=q.get('hed')||'';document.getElementById('h').innerHTML=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
const n=h.replace(/\*/g,'').length;document.getElementById('h').classList.add(n>70?'xlong':n>45?'long':n<26?'short':'x');
</script></body></html>
