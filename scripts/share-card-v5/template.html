<!doctype html><html><head><meta charset="utf-8"><style>
/* Share card v5 (light), 1200x630. Params: kicker, file, stamp, hed (wrap *punch*), dek */
:root{--paper:#FAF7F2;--line:#E7E1D6;--text:#16213A;--muted:#5A6378;--blue:#2450FF;--blue-ink:#1B3FE0;--hl:#FFE14D}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--paper)}
.card{position:relative;display:flex;flex-direction:column;width:1200px;height:630px;padding:56px 72px 130px;background:
 radial-gradient(520px 300px at 100% 0%,#EAF0FF 0%,transparent 70%),
 radial-gradient(circle at 1px 1px,rgba(22,33,58,.07) 1px,transparent 1.5px) 0 0/22px 22px,var(--paper);font-family:'Inter',sans-serif}
.top{display:flex;align-items:center;gap:18px}
.kicker{font:700 26px/1 'Inter',sans-serif;color:var(--blue-ink);letter-spacing:-.005em}
.kicker::before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--blue);margin-right:12px;vertical-align:3px}
.file{font:500 19px/1 'JetBrains Mono',monospace;color:var(--muted)}
.file::before{content:'·';margin-right:16px;color:#C9C1B3}
.hed{margin-top:auto;max-width:1056px;color:var(--text);font:800 76px/1.08 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;text-wrap:balance}
.hed mark{color:inherit;background:transparent;background-image:linear-gradient(98deg,rgba(255,225,77,0) .05em,rgba(255,225,77,.9) .22em,#FFE14D 45%,rgba(255,225,77,.85) calc(100% - .2em),rgba(255,225,77,0) 100%);background-repeat:no-repeat;background-size:100% .74em;background-position:0 82%;padding:0 .14em;margin:0 -.08em;border-radius:.6em .25em .7em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone;white-space:nowrap}
.hed.short{font-size:128px;line-height:1.02}.hed.mid{font-size:92px}.hed.long{font-size:76px}.hed.xlong{font-size:64px;line-height:1.1}
.dek{margin-top:20px;max-width:960px;color:var(--muted);font:400 28px/1.35 'Source Serif Pro',serif}
.foot{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--blue);display:flex;align-items:center;justify-content:space-between;padding:0 72px}
.brand{font:800 38px/1 'Bricolage Grotesque',sans-serif;color:#fff;letter-spacing:-.02em}
.brand b{font-weight:800;color:var(--text);background:var(--hl);padding:2px 10px 4px;border-radius:8px 3px 9px 4px;margin:0 2px}
.url{font:600 20px/1 'JetBrains Mono',monospace;color:#fff;letter-spacing:.04em}
.stamp{position:absolute;right:72px;top:46px;border:3px solid var(--blue);color:var(--blue-ink);background:rgba(255,255,255,.7);font:700 22px/1 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;border-radius:999px;transform:rotate(4deg)}
</style></head><body>
<div class="card">
 <div class="top"><span class="kicker" id="k">{{KICKER}}</span><span class="file" id="f">{{FILE}}</span></div>
 <div class="stamp" id="s">{{STAMP}}</div>
 <h1 class="hed" id="h">{{HED}}</h1>
 <p class="dek" id="d">{{DEK}}</p>
 <div class="foot"><span class="brand">The <b>Donald</b> Files</span><span class="url">THEDONALDFILES.COM</span></div>
</div>
<script>
const q=new URLSearchParams(location.search),set=(id,v)=>{const e=document.getElementById(id);if(v)e.textContent=v;else e.remove()};
set('k',q.get('kicker'));set('f',q.get('file'));set('s',q.get('stamp'));set('d',q.get('dek'));
const h=q.get('hed')||'',esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('h').innerHTML=esc(h).replace(/\*(.+?)\*/g,'<mark>$1</mark>');
const n=h.replace(/\*/g,'').length;document.getElementById('h').classList.add(n>70?'xlong':n>45?'long':n<26?'short':'mid');
</script></body></html>
